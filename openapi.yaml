openapi: 3.0.3
info:
  title: Offertrail
  version: 0.1.0
  description: >-
    Customer-journey offer studio for lawful data-for-value exchanges under GDPR.
    Journey-scoped offers pair tangible benefits with purpose-limited consent,
    cross-functional approval, fulfilment evidence, and trust-incident pauses.
  x-product-slug: ai-decentralized-offertrail
  x-source: ai-in-decentralized+ai/Accenture-Strategy-DD-GDPR-Infographic/
servers:
  - url: https://api.example.com
tags:
  - name: Journeys
    description: Priority customer journeys and journey-scoped offer catalogues
  - name: Offers
    description: Value offers, templates, and cross-functional approval
  - name: Consents
    description: Consent grant, revoke, and pause runtime
  - name: Fulfilments
    description: Promised value delivery evidence tied to consent events
  - name: Incidents
    description: Trust-incident controls and offer pauses
  - name: Reporting
    description: Opt-in, revoke, fulfilment analytics and audit exports
paths:
  /v1/journeys:
    get:
      operationId: listJourneys
      tags: [Journeys]
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: status
          in: query
          schema:
            type: string
            enum: [draft, active, archived]
      responses:
        "200":
          description: Journeys page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListEnvelopeJourney"
    post:
      operationId: createJourney
      tags: [Journeys]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JourneyCreate"
      responses:
        "201":
          description: Journey created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeJourney"
  /v1/journeys/{journeyId}:
    parameters:
      - $ref: "#/components/parameters/JourneyId"
    get:
      operationId: getJourney
      tags: [Journeys]
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Journey
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeJourney"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/offers:
    get:
      operationId: listOffers
      tags: [Offers]
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: journeyId
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
            enum: [draft, pending_approval, live, paused, retired]
      responses:
        "200":
          description: Offers page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListEnvelopeOffer"
    post:
      operationId: createOffer
      tags: [Offers]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OfferCreate"
      responses:
        "201":
          description: Offer draft created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeOffer"
  /v1/offers/{offerId}/approval:
    parameters:
      - $ref: "#/components/parameters/OfferId"
    post:
      operationId: submitOfferApproval
      tags: [Offers]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OfferApproval"
      responses:
        "200":
          description: Approval recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeApprovalRecord"
  /v1/consents:
    get:
      operationId: listConsents
      tags: [Consents]
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: offerId
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Consent events page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListEnvelopeConsentEvent"
    post:
      operationId: grantConsent
      tags: [Consents]
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConsentGrant"
      responses:
        "201":
          description: Consent granted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeConsentEvent"
  /v1/consents/{consentId}/revoke:
    parameters:
      - $ref: "#/components/parameters/ConsentId"
    post:
      operationId: revokeConsent
      tags: [Consents]
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
      responses:
        "200":
          description: Consent revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeRevocationEvent"
  /v1/fulfilments:
    post:
      operationId: recordFulfilment
      tags: [Fulfilments]
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FulfilmentProof"
      responses:
        "201":
          description: Fulfilment evidence recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeFulfilmentProof"
  /v1/fulfilments/{fulfilmentId}:
    parameters:
      - name: fulfilmentId
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getFulfilment
      tags: [Fulfilments]
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Fulfilment proof
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeFulfilmentProof"
  /v1/incidents:
    get:
      operationId: listTrustIncidents
      tags: [Incidents]
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Trust incidents page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListEnvelopeTrustIncident"
    post:
      operationId: declareTrustIncident
      tags: [Incidents]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TrustIncidentCreate"
      responses:
        "201":
          description: Incident declared; linked offers paused
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeTrustIncident"
  /v1/incidents/{incidentId}/pause-offers:
    parameters:
      - $ref: "#/components/parameters/IncidentId"
    post:
      operationId: pauseOffersForIncident
      tags: [Incidents]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                offerClass:
                  type: string
                  enum: [third_party_share, all_live]
      responses:
        "202":
          description: Pause accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeTrustIncident"
  /v1/reports/offer-performance:
    get:
      operationId: getOfferPerformanceReport
      tags: [Reporting]
      security:
        - BearerAuth: []
      parameters:
        - name: journeyId
          in: query
          schema:
            type: string
        - name: period
          in: query
          schema:
            type: string
            example: 2026-Q1
      responses:
        "200":
          description: Opt-in, revoke, and fulfilment rates by offer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeOfferPerformanceReport"
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    JourneyId:
      name: journeyId
      in: path
      required: true
      schema:
        type: string
    OfferId:
      name: offerId
      in: path
      required: true
      schema:
        type: string
    ConsentId:
      name: consentId
      in: path
      required: true
      schema:
        type: string
    IncidentId:
      name: incidentId
      in: path
      required: true
      schema:
        type: string
  responses:
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    ResponseMeta:
      type: object
      required: [requestId, timestamp]
      properties:
        requestId:
          type: string
        timestamp:
          type: string
          format: date-time
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
    Journey:
      type: object
      required: [id, name, status]
      properties:
        id:
          type: string
        name:
          type: string
        status:
          type: string
          enum: [draft, active, archived]
        description:
          type: string
    JourneyCreate:
      type: object
      required: [name]
      properties:
        name:
          type: string
        description:
          type: string
    Offer:
      type: object
      required: [id, journeyId, name, status, valueType]
      properties:
        id:
          type: string
        journeyId:
          type: string
        name:
          type: string
        status:
          type: string
          enum: [draft, pending_approval, live, paused, retired]
        valueType:
          type: string
          enum: [discount, service_upgrade, choosable_third_party_share]
        purpose:
          type: string
        dataCategories:
          type: array
          items:
            type: string
        thirdPartySharing:
          type: string
          enum: [excluded, optional, required]
    OfferCreate:
      type: object
      required: [journeyId, name, valueType, purpose, dataCategories]
      properties:
        journeyId:
          type: string
        name:
          type: string
        valueType:
          type: string
        purpose:
          type: string
        dataCategories:
          type: array
          items:
            type: string
        thirdPartySharing:
          type: string
          enum: [excluded, optional]
    OfferApproval:
      type: object
      required: [role, decision]
      properties:
        role:
          type: string
          enum: [business, privacy, technology]
        decision:
          type: string
          enum: [approved, rejected]
        rationale:
          type: string
    ApprovalRecord:
      type: object
      properties:
        offerId:
          type: string
        role:
          type: string
        decision:
          type: string
        decidedAt:
          type: string
          format: date-time
    ConsentEvent:
      type: object
      required: [id, offerId, subjectRef, status]
      properties:
        id:
          type: string
        offerId:
          type: string
        subjectRef:
          type: string
          description: Pseudonymous CRM reference, not raw PII
        status:
          type: string
          enum: [active, revoked]
        grantedAt:
          type: string
          format: date-time
    ConsentGrant:
      type: object
      required: [offerId, subjectRef]
      properties:
        offerId:
          type: string
        subjectRef:
          type: string
        channel:
          type: string
    RevocationEvent:
      type: object
      properties:
        consentId:
          type: string
        revokedAt:
          type: string
          format: date-time
        reason:
          type: string
    FulfilmentProof:
      type: object
      required: [consentId, fulfilmentType, evidenceRef]
      properties:
        consentId:
          type: string
        fulfilmentType:
          type: string
          enum: [coupon_issued, service_unlocked, discount_applied]
        evidenceRef:
          type: string
        fulfilledAt:
          type: string
          format: date-time
    TrustIncident:
      type: object
      required: [id, severity, status]
      properties:
        id:
          type: string
        severity:
          type: string
          enum: [low, medium, high]
        status:
          type: string
          enum: [open, mitigating, closed]
        linkedOfferIds:
          type: array
          items:
            type: string
    TrustIncidentCreate:
      type: object
      required: [severity, summary]
      properties:
        severity:
          type: string
        summary:
          type: string
    OfferPerformanceReport:
      type: object
      properties:
        journeyId:
          type: string
        period:
          type: string
        optInRate:
          type: number
          format: float
        revokeRate:
          type: number
          format: float
        fulfilmentRate24h:
          type: number
          format: float
        offers:
          type: array
          items:
            type: object
            properties:
              offerId:
                type: string
              optIns:
                type: integer
              revocations:
                type: integer
    DataEnvelopeJourney:
      type: object
      required: [data, meta]
      properties:
        data:
          $ref: "#/components/schemas/Journey"
        meta:
          $ref: "#/components/schemas/ResponseMeta"
    DataEnvelopeOffer:
      type: object
      required: [data, meta]
      properties:
        data:
          $ref: "#/components/schemas/Offer"
        meta:
          $ref: "#/components/schemas/ResponseMeta"
    DataEnvelopeApprovalRecord:
      type: object
      required: [data, meta]
      properties:
        data:
          $ref: "#/components/schemas/ApprovalRecord"
        meta:
          $ref: "#/components/schemas/ResponseMeta"
    DataEnvelopeConsentEvent:
      type: object
      required: [data, meta]
      properties:
        data:
          $ref: "#/components/schemas/ConsentEvent"
        meta:
          $ref: "#/components/schemas/ResponseMeta"
    DataEnvelopeRevocationEvent:
      type: object
      required: [data, meta]
      properties:
        data:
          $ref: "#/components/schemas/RevocationEvent"
        meta:
          $ref: "#/components/schemas/ResponseMeta"
    DataEnvelopeFulfilmentProof:
      type: object
      required: [data, meta]
      properties:
        data:
          $ref: "#/components/schemas/FulfilmentProof"
        meta:
          $ref: "#/components/schemas/ResponseMeta"
    DataEnvelopeTrustIncident:
      type: object
      required: [data, meta]
      properties:
        data:
          $ref: "#/components/schemas/TrustIncident"
        meta:
          $ref: "#/components/schemas/ResponseMeta"
    DataEnvelopeOfferPerformanceReport:
      type: object
      required: [data, meta]
      properties:
        data:
          $ref: "#/components/schemas/OfferPerformanceReport"
        meta:
          $ref: "#/components/schemas/ResponseMeta"
    ListEnvelopeJourney:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/Journey"
            nextCursor:
              type: string
        meta:
          $ref: "#/components/schemas/ResponseMeta"
    ListEnvelopeOffer:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/Offer"
            nextCursor:
              type: string
        meta:
          $ref: "#/components/schemas/ResponseMeta"
    ListEnvelopeConsentEvent:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/ConsentEvent"
            nextCursor:
              type: string
        meta:
          $ref: "#/components/schemas/ResponseMeta"
    ListEnvelopeTrustIncident:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/TrustIncident"
            nextCursor:
              type: string
        meta:
          $ref: "#/components/schemas/ResponseMeta"
